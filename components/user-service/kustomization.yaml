apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ../../base/user-service/configmap.yaml
  - ../../base/user-service/deployment.yaml
  - ../../base/user-service/service.yaml

patches:
  - target:
      kind: ConfigMap
      name: myreadings-app-config
    patch: |
      - op: add
        path: /data/USER_SERVICE_URL
        value: http://myreadings-user-service:8083
  - target:
      kind: Deployment
      name: myreadings-ui
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://myreadings-user-service:8083
